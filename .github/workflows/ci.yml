name: BankFlowCRM UI CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:

  build:
    name: Build React UI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Display Node.js version
        run: node --version

      - name: Display npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
