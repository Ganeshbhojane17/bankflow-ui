name: BankFlowCRM UI CI/CD

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - master


jobs:

  # ==========================================================
  # 1. BUILD REACT APPLICATION
  # ==========================================================

  build:
    name: Build React UI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Display Node.js version
        run: node --version

      - name: Display npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build


  # ==========================================================
  # 2. BUILD & PUSH DOCKER IMAGE
  # ==========================================================

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - build

    if: github.event_name == 'push'

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=" >> "$GITHUB_OUTPUT"
          fi


      # ------------------------------------------------------
      # Build and Push React UI
      # ------------------------------------------------------

      - name: Build and push UI Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          build-args: |
            VITE_IDENTITY_API_URL=http://104.211.101.235:7206/api
            VITE_CUSTOMER_API_URL=http://104.211.101.235:7087/api

          tags: |
            ganesh170599/bankflow-ui:latest
            ganesh170599/bankflow-ui:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.version_tag && format('ganesh170599/bankflow-ui:{0}', steps.meta.outputs.version_tag) || '' }}


  # ==========================================================
  # 3. DEPLOY UI TO AZURE VM
  # ==========================================================

  deploy:
    name: Deploy UI to Azure VM
    runs-on: ubuntu-latest

    needs:
      - docker

    if: github.event_name == 'push'

    steps:

      # ------------------------------------------------------
      # Configure SSH
      # ------------------------------------------------------

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.AZURE_VM_SSH_KEY }}" > ~/.ssh/bankflow-github-actions

          chmod 600 ~/.ssh/bankflow-github-actions

          ssh-keyscan -H "${{ secrets.AZURE_VM_HOST }}" >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts


      # ------------------------------------------------------
      # Test SSH
      # ------------------------------------------------------

      - name: Test SSH connection
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/bankflow-github-actions \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }}" \
            "echo 'SSH connection to Azure VM successful'"


      # ------------------------------------------------------
      # Deploy UI
      # ------------------------------------------------------

      - name: Deploy UI
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/bankflow-github-actions \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }}" \
            << 'EOF'

          set -e

          echo "=========================================="
          echo "Starting BankFlowCRM UI Deployment"
          echo "=========================================="

          cd /opt/bankflowcrm

          echo ""
          echo "Pulling latest UI Docker image..."

          sudo docker compose pull bankflow-ui

          echo ""
          echo "Restarting UI..."

          sudo docker compose up -d bankflow-ui

          echo ""
          echo "Waiting for UI container..."

          sleep 5

          echo ""
          echo "Current Docker Compose status:"

          sudo docker compose ps bankflow-ui

          echo ""
          echo "=========================================="
          echo "UI deployment completed"
          echo "=========================================="

          EOF
