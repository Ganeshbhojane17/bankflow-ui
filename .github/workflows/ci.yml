name: BankFlowCRM UI CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


jobs:

  # ==========================================
  # JOB 1 - BUILD REACT APPLICATION
  # ==========================================

  build:
    name: Build React UI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      - name: Display Node.js version
        run: node --version


      - name: Display npm version
        run: npm --version


      - name: Install dependencies
        run: npm ci


      - name: Build React application
        run: npm run build


  # ==========================================
  # JOB 2 - BUILD AND PUSH DOCKER IMAGE
  # ==========================================

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs: build

    # Docker image is published only for pushes.
    # Pull requests only run the React build.
    if: github.event_name == 'push'

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      # ------------------------------------------
      # Docker Hub Login
      # ------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ------------------------------------------
      # Docker Buildx
      # ------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------
      # Generate Git SHA Docker Tag
      # ------------------------------------------

      - name: Generate Docker image tag
        id: meta
        shell: bash
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"


      # ------------------------------------------
      # Build and Push React UI
      # ------------------------------------------

      - name: Build and push UI Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: true

          # Vite environment variables are required
          # during the React build inside Docker.
          build-args: |
            VITE_IDENTITY_API_URL=http://localhost:7206/api
            VITE_CUSTOMER_API_URL=http://localhost:7087/api

          tags: |
            ganesh170599/bankflow-ui:latest
            ganesh170599/bankflow-ui:${{ steps.meta.outputs.sha_tag }}
