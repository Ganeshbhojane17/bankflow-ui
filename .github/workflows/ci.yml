name: BankFlowCRM UI CI

on:
  push:
    branches:
      - master

    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - master


jobs:

  # ==========================================
  # JOB 1 - BUILD REACT APPLICATION
  # ==========================================

  build:
    name: Build React UI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      - name: Display Node.js version
        run: node --version


      - name: Display npm version
        run: npm --version


      - name: Install dependencies
        run: npm ci


      - name: Build React application
        run: npm run build


  # ==========================================
  # JOB 2 - BUILD AND PUSH DOCKER IMAGE
  # ==========================================

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs: build

    if: github.event_name == 'push'

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      # ------------------------------------------
      # Docker Hub Login
      # ------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ------------------------------------------
      # Docker Buildx
      # ------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------
      # Generate Docker Tags
      # ------------------------------------------

      - name: Generate Docker image tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=" >> "$GITHUB_OUTPUT"
          fi


      # ==========================================
      # REACT UI
      # ==========================================

      - name: Build and push UI Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: true

          build-args: |
            VITE_IDENTITY_API_URL=http://localhost:7206/api
            VITE_CUSTOMER_API_URL=http://localhost:7087/api

          tags: |
            ganesh170599/bankflow-ui:latest
            ganesh170599/bankflow-ui:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.version_tag && format('ganesh170599/bankflow-ui:{0}', steps.meta.outputs.version_tag) || '' }}
